name: Client release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag
        required: true
        type: string
permissions:
  contents: read
  checks: read
concurrency:
  group: client-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node tooling/verify-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm engine:setup
      - run: pnpm docs:check
      - run: pnpm release:build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: client-${{ runner.os }}-${{ runner.arch }}
          path: |
            work/releases/*.tar.gz
            work/releases/*.sha256
            work/releases/*.signing.json
            work/releases/*.tgz
            docs/technical-guide.pdf
          if-no-files-found: error
          retention-days: 7
  documentation:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require scoped cross-repository documentation identity
        env:
          DOCS_TOKEN: ${{ secrets.KEEPSEAM_DOCS_TOKEN }}
        run: test -n "$DOCS_TOKEN" || { echo 'Configure the scoped Keepseam documentation GitHub App token before releasing.'; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: client
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Altitud-Studio-S-L-U/keepseam-cloud
          path: cloud
          token: ${{ secrets.KEEPSEAM_DOCS_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: client/.node-version
          package-manager-cache: false
      - run: pnpm --dir client install --frozen-lockfile && pnpm --dir client build
      - run: pnpm --dir cloud install --frozen-lockfile
      - name: Reject a release whose public documentation has not been updated and reviewed
        run: node cloud/tooling/sync-client-docs.mjs "$PWD/client" --check
  publish:
    needs: [build, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
      - name: Create a draft release with reviewed binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find artifacts -type f ! -name technical-guide.pdf | sort)
          test "${#files[@]}" -gt 0
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Keepseam $RELEASE_TAG" --notes 'Portable client executables and version-pinned SDK. Extract the complete platform archive. Publication remains a reviewed release action.' "${files[@]}"
