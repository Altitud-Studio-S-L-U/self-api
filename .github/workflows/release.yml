name: SDK release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag
        required: true
        type: string
      sign_repository:
        description: Use protected pre-provisioned signing runners and export an optional public TUF repository
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  checks: read
concurrency:
  group: sdk-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.reviewed.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: reviewed
        run: node tooling/verify-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            signing_runner: self-managed-api-release-linux
          - os: windows-latest
            signing_runner: self-managed-api-release-windows
          - os: macos-latest
            signing_runner: self-managed-api-release-macos
    runs-on: ${{ inputs.sign_repository && fromJSON(format('["self-hosted","{0}"]', matrix.signing_runner)) || matrix.os }}
    environment: ${{ inputs.sign_repository && 'sdk-release-signing' || 'sdk-release-build' }}
    timeout-minutes: 30
    env:
      SELF_MANAGED_API_REQUIRE_NATIVE_SIGNING: ${{ inputs.sign_repository && '1' || '' }}
      SELF_MANAGED_API_WINDOWS_SIGN_CERT_SHA1: ${{ inputs.sign_repository && vars.SELF_MANAGED_API_WINDOWS_SIGN_CERT_SHA1 || '' }}
      SELF_MANAGED_API_SIGNTOOL_PATH: ${{ inputs.sign_repository && vars.SELF_MANAGED_API_SIGNTOOL_PATH || '' }}
      SELF_MANAGED_API_WINDOWS_TIMESTAMP_URL: ${{ inputs.sign_repository && vars.SELF_MANAGED_API_WINDOWS_TIMESTAMP_URL || '' }}
      SELF_MANAGED_API_WINDOWS_PUBLISHER: ${{ inputs.sign_repository && vars.SELF_MANAGED_API_WINDOWS_PUBLISHER || '' }}
      SELF_MANAGED_API_APPLE_SIGN_IDENTITY: ${{ inputs.sign_repository && vars.SELF_MANAGED_API_APPLE_SIGN_IDENTITY || '' }}
      SELF_MANAGED_API_APPLE_NOTARY_PROFILE: ${{ inputs.sign_repository && vars.SELF_MANAGED_API_APPLE_NOTARY_PROFILE || '' }}
      SELF_MANAGED_API_APPLE_PUBLISHER: ${{ inputs.sign_repository && vars.SELF_MANAGED_API_APPLE_PUBLISHER || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm engine:setup
      - run: pnpm docs:check
      - run: pnpm release:build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: client-${{ runner.os }}-${{ runner.arch }}
          path: |
            work/releases/*.tar.gz
            work/releases/*.sha256
            work/releases/*.signing.json
            work/releases/*.tgz
            docs/technical-guide.pdf
          if-no-files-found: error
          retention-days: 7
  documentation:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
  publish:
    needs: [build, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
      - name: Create a draft release with reviewed binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find artifacts -type f ! -name technical-guide.pdf | sort)
          test "${#files[@]}" -gt 0
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Self-managed API $RELEASE_TAG" --notes 'Portable client executables and version-pinned SDK. Extract the complete platform archive. Publication remains a reviewed release action.' "${files[@]}"
  repository:
    if: ${{ inputs.sign_repository }}
    needs: [verify, build, documentation, publish]
    runs-on: [self-hosted, self-managed-api-release-signing]
    environment: sdk-release-signing
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SELF_MANAGED_API_RELEASE_SIGNING_CONFIG: ${{ vars.SELF_MANAGED_API_RELEASE_SIGNING_CONFIG }}
      SELF_MANAGED_API_RELEASE_SOURCE_REVISION: ${{ needs.verify.outputs.sha }}
      SELF_MANAGED_API_RELEASE_INPUT_DIRECTORY: ${{ github.workspace }}/work/release-input
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: client-*
          merge-multiple: true
          path: work/release-input
      - name: Export exact reviewed artifacts with separately provisioned TUF keys
        run: |
          chmod 700 work/release-input
          node tooling/sign-release-cli.mjs --config "$SELF_MANAGED_API_RELEASE_SIGNING_CONFIG" > work/release-result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: signed-repository-${{ env.RELEASE_TAG }}
          path: work/releases/signed-*/repository/
          if-no-files-found: error
          retention-days: 7
      - name: Attach public repository bytes to the existing draft without publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          repository="$(node -e "console.log(JSON.parse(require('fs').readFileSync('work/release-result.json','utf8')).repositoryDirectory)")"
          archive="work/releases/self-managed-api-$RELEASE_TAG-tuf.tar.gz"
          tar -czf "$archive" -C "$repository" .
          gh release upload "$RELEASE_TAG" "$archive"
