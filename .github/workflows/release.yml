name: Client release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed version tag
        required: true
        type: string
      sign_delivery:
        description: Use protected pre-provisioned signing runners and export a Cloud delivery (draft only)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  checks: read
concurrency:
  group: client-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.reviewed.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: reviewed
        run: node tooling/verify-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            signing_runner: keepseam-release-linux
          - os: windows-latest
            signing_runner: keepseam-release-windows
          - os: macos-latest
            signing_runner: keepseam-release-macos
    runs-on: ${{ inputs.sign_delivery && fromJSON(format('["self-hosted","{0}"]', matrix.signing_runner)) || matrix.os }}
    environment: ${{ inputs.sign_delivery && 'client-release-signing' || 'client-release-build' }}
    timeout-minutes: 30
    env:
      KEEPSEAM_REQUIRE_NATIVE_SIGNING: ${{ inputs.sign_delivery && '1' || '' }}
      KEEPSEAM_WINDOWS_SIGN_CERT_SHA1: ${{ inputs.sign_delivery && vars.KEEPSEAM_WINDOWS_SIGN_CERT_SHA1 || '' }}
      KEEPSEAM_SIGNTOOL_PATH: ${{ inputs.sign_delivery && vars.KEEPSEAM_SIGNTOOL_PATH || '' }}
      KEEPSEAM_WINDOWS_TIMESTAMP_URL: ${{ inputs.sign_delivery && vars.KEEPSEAM_WINDOWS_TIMESTAMP_URL || '' }}
      KEEPSEAM_WINDOWS_PUBLISHER: ${{ inputs.sign_delivery && vars.KEEPSEAM_WINDOWS_PUBLISHER || '' }}
      KEEPSEAM_APPLE_SIGN_IDENTITY: ${{ inputs.sign_delivery && vars.KEEPSEAM_APPLE_SIGN_IDENTITY || '' }}
      KEEPSEAM_APPLE_NOTARY_PROFILE: ${{ inputs.sign_delivery && vars.KEEPSEAM_APPLE_NOTARY_PROFILE || '' }}
      KEEPSEAM_APPLE_PUBLISHER: ${{ inputs.sign_delivery && vars.KEEPSEAM_APPLE_PUBLISHER || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm engine:setup
      - run: pnpm docs:check
      - run: pnpm release:build
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: client-${{ runner.os }}-${{ runner.arch }}
          path: |
            work/releases/*.tar.gz
            work/releases/*.sha256
            work/releases/*.signing.json
            work/releases/*.tgz
            docs/technical-guide.pdf
          if-no-files-found: error
          retention-days: 7
  documentation:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require scoped cross-repository documentation identity
        env:
          DOCS_TOKEN: ${{ secrets.KEEPSEAM_DOCS_TOKEN }}
        run: test -n "$DOCS_TOKEN" || { echo 'Configure the scoped Keepseam documentation GitHub App token before releasing.'; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: client
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Altitud-Studio-S-L-U/keepseam-cloud
          path: cloud
          token: ${{ secrets.KEEPSEAM_DOCS_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: client/.node-version
          package-manager-cache: false
      - run: pnpm --dir client install --frozen-lockfile && pnpm --dir client build
      - run: pnpm --dir cloud install --frozen-lockfile
      - name: Reject a release whose public documentation has not been updated and reviewed
        run: node cloud/tooling/sync-client-docs.mjs "$PWD/client" --check
  publish:
    needs: [build, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
      - name: Create a draft release with reviewed binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t files < <(find artifacts -type f ! -name technical-guide.pdf | sort)
          test "${#files[@]}" -gt 0
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Keepseam $RELEASE_TAG" --notes 'Portable client executables and version-pinned SDK. Extract the complete platform archive. Publication remains a reviewed release action.' "${files[@]}"
  delivery:
    if: ${{ inputs.sign_delivery }}
    needs: [verify, build, documentation, publish]
    runs-on: [self-hosted, keepseam-release-signing]
    environment: client-release-signing
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      KEEPSEAM_RELEASE_SIGNING_CONFIG: ${{ vars.KEEPSEAM_RELEASE_SIGNING_CONFIG }}
      KEEPSEAM_RELEASE_SOURCE_REVISION: ${{ needs.verify.outputs.sha }}
      KEEPSEAM_RELEASE_INPUT_DIRECTORY: ${{ github.workspace }}/work/release-input
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: client-*
          merge-multiple: true
          path: work/release-input
      - name: Export exact reviewed artifacts with separately provisioned TUF keys
        run: |
          chmod 700 work/release-input
          node tooling/sign-release-cli.mjs --config "$KEEPSEAM_RELEASE_SIGNING_CONFIG" > work/release-result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: signed-delivery-${{ env.RELEASE_TAG }}
          path: work/releases/signed-*/delivery/
          if-no-files-found: error
          retention-days: 7
      - name: Attach the operator delivery to the existing draft without publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          delivery="$(node -e "console.log(JSON.parse(require('fs').readFileSync('work/release-result.json','utf8')).deliveryDirectory)")"
          archive="work/releases/keepseam-$RELEASE_TAG-delivery.tar.gz"
          tar -czf "$archive" -C "$delivery" .
          gh release upload "$RELEASE_TAG" "$archive"
